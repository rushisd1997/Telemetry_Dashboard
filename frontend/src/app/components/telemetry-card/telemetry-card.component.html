<section class="metric-card">
      <div class="metric-header">
        <div>
          <div class="metric-title">{{ definition.label }}</div>
          <div class="metric-subtitle">Live telemetry</div>
        </div>
        <select [ngModel]="selectedUnit" (ngModelChange)="unitChange.emit($event)">
          <option *ngFor="let unit of definition.units" [value]="unit">{{ unit }}</option>
        </select>
      </div>
      <div class="gauge-row">
        <app-gauge [label]="definition.label" [value]="value" [unit]="selectedUnit" [min]="definition.min" [max]="definition.max" [status]="status"></app-gauge>
        <div class="metric-summary">
          <div class="current-value">{{ value | number:'1.0-2' }} <span>{{ selectedUnit }}</span></div>
          <div class="status" [class.warning]="status === 'Warning'" [class.critical]="status === 'Critical'">
            <span class="status-dot"></span>{{ status }}
          </div>
          <div class="updated">Updated {{ updatedAt | date:'mediumTime' }}</div>
        </div>
      </div>
      <div class="chart-title">Live trend</div>
      <app-trend-chart [data]="history" [unit]="selectedUnit"></app-trend-chart>
    </section>
